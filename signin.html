<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in to Git'er…</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         text-align: center; padding: 64px 24px; color: #1d1d1f; background: #fafafa; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #666; font-size: 15px; }
  a.btn { display: inline-block; margin-top: 20px; padding: 10px 20px; border-radius: 10px;
          background: #0071e3; color: #fff; text-decoration: none; font-weight: 600; }
  #fallback { display: none; margin-top: 28px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1d1d1f; color: #f5f5f7; } p { color: #a1a1a6; }
  }
</style>
</head>
<body>
  <h1>Opening Git'er…</h1>
  <p>Finishing your sign-in — you can close this tab once the app opens.</p>
  <div id="fallback">
    <p>Didn't open automatically?</p>
    <a class="btn" id="manual" href="#">Open Git'er to finish signing in</a>
  </div>
<script>
  // The email sign-in link redirects here carrying the Firebase oobCode. Forward
  // it into the app via its custom scheme so the click completes sign-in in-app.
  (function () {
    var p = new URLSearchParams(location.search);
    var oob = p.get("oobCode");
    var email = p.get("email");
    if (!oob) {
      document.querySelector("h1").textContent = "Sign-in link is incomplete";
      document.querySelector("p").textContent =
        "This link is missing its code — request a fresh one from the app.";
      return;
    }
    var target = "giter://signin?oobCode=" + encodeURIComponent(oob) +
                 (email ? "&email=" + encodeURIComponent(email) : "");
    // Try to hand off to the app immediately…
    location.replace(target);
    // …and, if the browser blocks the auto-redirect, show a manual button.
    setTimeout(function () {
      document.getElementById("manual").href = target;
      document.getElementById("fallback").style.display = "block";
    }, 1400);
  })();
</script>
</body>
</html>
